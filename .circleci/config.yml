version: 2
jobs:
  build:
    docker:
      - image: kristianmitk/dory:latest
    steps:
      - checkout
      - run: cd infiniband && ./build.py clean && ./build.py -c gcc all
      - run: cd infiniband && ./build.py clean && ./build.py -c clang all
      - run: cd infiniband && ./build.py clean && ./build.py -c gcc -b debug all
      - run: cd infiniband && ./build.py clean && ./build.py -c clang -b debug all
      - run: cd infiniband && CONAN_DEFAULT_PROFILE_PATH="$(pwd)/conan/profiles/gcc-release.profile" conan test ./neb/test dory-neb/0.0.1 --build=missing
